    const SITE = {
      title: "the bear with dementia",
      tagline: " on the path of job hunting, i achieved nirvana",
      author: "sethulakshmi",
      authorInitials: "",
      instagramUrl: "https://instagram.com/thebearwithdementia",
      email: "",
      bio: [
        "I've been writing in scrollable places for a while.",
        "You can find my rants about books, films, music, history, politics and some random thoughts which i overthink past 3am.",
        ""
      ]
    };

    const SECTIONS = {
      thoughts:  { label: "Thoughts",  tagline: "a part of what i feel, what i felt and what makes me political.", data: THOUGHTS },
      films:     { label: "Films",     tagline: "to experience a great film is to achieve climax.", data: FILMS },
      bookshelf: { label: "Bookshelf", tagline: "my mom says books made me a bad rebel girl.", data: BOOKSHELF }
    
    };
    const SECTION_KEYS = Object.keys(SECTIONS);

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }

    function readingTime(text) {
      const words = text.trim().split(/\s+/).length;
      return Math.max(1, Math.round(words / 200));
    }

    function starString(rating) {
      if (!rating) return '';
      return '★'.repeat(rating) + '☆'.repeat(Math.max(0, 5 - rating));
    }

    function sortedBySection(key) {
      return [...SECTIONS[key].data].sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function allEntriesSorted() {
      const all = [];
      SECTION_KEYS.forEach(function (key) {
        SECTIONS[key].data.forEach(function (e) {
          all.push(Object.assign({}, e, { section: key }));
        });
      });
      return all.sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function renderHeader(active) {
      return `
        <header class="site-header">
          <div class="wrap header-inner">
            <a href="#/" class="site-mark">${SITE.title}</a>
            <nav class="nav-links">
              ${SECTION_KEYS.map(key => `<a href="#/${key}" class="${active === key ? 'active' : ''}">${SECTIONS[key].label}</a>`).join('')}
              <a href="#/about" class="${active === 'about' ? 'active' : ''}">About</a>
              <a href="#subscribe" class="nav-cta">Subscribe</a>
            </nav>
          </div>
        </header>
      `;
    }

    function renderFooter() {
      return `
        <footer class="site-footer">
          <div class="wrap footer-inner">
            <div class="footer-col">
              <div class="site-mark">${SITE.title}</div>
              <p class="footer-tagline">${SITE.tagline}</p>
              <nav class="footer-nav">
                ${SECTION_KEYS.map(key => `<a href="#/${key}">${SECTIONS[key].label}</a>`).join('')}
                <a href="#/about">About</a>
              </nav>
              <p class="footer-copy">© ${new Date().getFullYear()} ${SITE.author}</p>
            </div>
            <div class="footer-col" id="subscribe">
              <p class="section-label">Get new posts by email</p>
              <!-- NEWSLETTER FORM: front-end only. Connect to Buttondown / ConvertKit / Mailchimp to actually collect emails. -->
              <form id="newsletter-form" class="newsletter-form">
                <input type="email" required placeholder="you@example.com" aria-label="Email address" />
                <button type="submit">Subscribe</button>
              </form>
              <p class="form-msg" aria-live="polite"></p>
              <a href="${SITE.instagramUrl}" target="_blank" rel="noopener" class="footer-ig">Also on Instagram ↗</a>
            </div>
          </div>
        </footer>
      `;
    }

    function metaBitsHTML(entry) {
      const bits = [];
      if (entry.section === 'films' && (entry.director || entry.year)) {
        bits.push([entry.director, entry.year].filter(Boolean).join(', '));
      }
      if (entry.section === 'bookshelf') {
        if (entry.author) bits.push('by ' + entry.author);
        if (entry.status) bits.push(entry.status === 'reading' ? 'Currently reading' : 'Finished');
      }
      if (entry.rating) bits.push(`<span class="rating">${starString(entry.rating)}</span>`);
      if (entry.section === 'essays') bits.push(readingTime(entry.content.join(' ')) + ' min read');
      if (entry.tags && entry.tags.length) bits.push(entry.tags.join(' · '));
      return bits.join(' · ');
    }

    function entryCardHTML(entry, opts) {
      opts = opts || {};
      const href = `#/${entry.section}/${entry.slug}`;
      const kindLabel = opts.showKind ? `<span class="entry-kind">${SECTIONS[entry.section].label}</span>` : '';
      const thumbHTML = entry.image
        ? `<div class="entry-thumb"><img src="${entry.image}" alt="${entry.imageAlt || entry.title || 'Photo'}" loading="lazy" /></div>`
        : '';
      const linkClass = entry.image ? 'entry-link has-image' : 'entry-link';

      if (entry.section === 'thoughts') {
        const tagsLine = (entry.tags && entry.tags.length) ? `<p class="entry-meta">${entry.tags.join(' · ')}</p>` : '';
        return `
          <article class="entry entry--thought">
            <a href="${href}" class="${linkClass}">
              ${thumbHTML}
              <div class="entry-body-col">
                ${kindLabel}
                <time class="entry-date">${formatDate(entry.date)}</time>
                <p class="thought-text">${entry.content.join(' ')}</p>
                ${tagsLine}
              </div>
            </a>
          </article>
        `;
      }
      return `
        <article class="entry">
          <a href="${href}" class="${linkClass}">
            ${thumbHTML}
            <div class="entry-body-col">
              ${kindLabel}
              <time class="entry-date">${formatDate(entry.date)}</time>
              <h3 class="entry-title">${entry.title}</h3>
              <p class="entry-excerpt">${entry.excerpt}</p>
              <p class="entry-meta">${metaBitsHTML(entry)}</p>
            </div>
          </a>
        </article>
      `;
    }

    function renderHome() {
      const latest = allEntriesSorted().slice(0, 6);
      return `
        ${renderHeader('home')}
        <main id="main">
          <section class="wrap hero">
            <p class="eyebrow">Essays, thoughts, films &amp; books</p>
            <h1 class="hero-title">Some thoughts need more than a caption.</h1>
            <p class="hero-sub">Personal essays, running thoughts, and notes on films and books I'm reading — kept somewhere that isn't a feed.</p>
            <a href="#subscribe" class="hero-cta">Get new posts by email →</a>
          </section>
          <section class="wrap">
            <p class="section-label">Latest</p>
            <div class="entry-list">
              ${latest.map(e => entryCardHTML(e, { showKind: true })).join('')}
            </div>
          </section>
          <section class="wrap explore-section">
            <p class="section-label">Browse by section</p>
            <div class="explore-grid">
              ${SECTION_KEYS.map(key => `
                <a href="#/${key}" class="explore-card">
                  <span class="explore-title">${SECTIONS[key].label}</span>
                  <span class="explore-tagline">${SECTIONS[key].tagline}</span>
                  <span class="explore-arrow">→</span>
                </a>
              `).join('')}
            </div>
          </section>
        </main>
        ${renderFooter()}
      `;
    }

    function renderArchive(key) {
      const sorted = sortedBySection(key).map(e => Object.assign({}, e, { section: key }));
      const byYear = {};
      sorted.forEach(e => {
        const y = e.date.slice(0, 4);
        (byYear[y] = byYear[y] || []).push(e);
      });
      const years = Object.keys(byYear).sort((a, b) => b - a);
      return `
        ${renderHeader(key)}
        <main id="main">
          <section class="wrap page-head">
            <h1 class="page-title">${SECTIONS[key].label}</h1>
            <p class="hero-sub" style="margin:.6rem 0 0;">${SECTIONS[key].tagline}</p>
          </section>
          ${years.length ? years.map(y => `
            <section class="wrap">
              <p class="year-label">${y}</p>
              <div class="entry-list">${byYear[y].map(e => entryCardHTML(e)).join('')}</div>
            </section>
          `).join('') : '<div class="wrap"><p class="empty-msg" style="padding:2rem 0;">Nothing here yet.</p></div>'}
        </main>
        ${renderFooter()}
      `;
    }

    function renderTagView(tag) {
      const filtered = allEntriesSorted().filter(e => e.tags && e.tags.includes(tag));
      return `
        ${renderHeader('')}
        <main id="main">
          <section class="wrap page-head">
            <p class="section-label">Tagged</p>
            <h1 class="page-title">${tag}</h1>
          </section>
          <section class="wrap">
            <div class="entry-list">
              ${filtered.length ? filtered.map(e => entryCardHTML(e, { showKind: true })).join('') : '<p class="empty-msg">Nothing with this tag yet.</p>'}
            </div>
          </section>
        </main>
        ${renderFooter()}
      `;
    }

    function renderDetail(key, slug) {
      const list = sortedBySection(key).map(e => Object.assign({}, e, { section: key }));
      const idx = list.findIndex(e => e.slug === slug);
      if (idx === -1) return render404();
      const entry = list[idx];
      const prev = list[idx + 1];
      const next = list[idx - 1];
      const isThought = key === 'thoughts';

      const metaParts = [];
      if (!isThought) metaParts.push(formatDate(entry.date));
      if (key === 'essays') metaParts.push(readingTime(entry.content.join(' ')) + ' min read');
      if (key === 'films' && (entry.director || entry.year)) {
        metaParts.push([entry.director, entry.year].filter(Boolean).join(', '));
      }
      if (key === 'bookshelf') {
        if (entry.author) metaParts.push('by ' + entry.author);
        if (entry.status) metaParts.push(entry.status === 'reading' ? 'Currently reading' : 'Finished');
      }

      const prevHTML = prev ? `<a href="#/${key}/${prev.slug}" class="pag-link prev"><span>← Previous</span>${prev.title || formatDate(prev.date)}</a>` : '<span></span>';
      const nextHTML = next ? `<a href="#/${key}/${next.slug}" class="pag-link next"><span>Next →</span>${next.title || formatDate(next.date)}</a>` : '';

      return `
        ${renderHeader(key)}
        <main id="main">
          <article class="essay-wrap">
            <a href="#/${key}" class="back-link">← Back to ${SECTIONS[key].label}</a>
            ${metaParts.length ? `<p class="essay-meta">${metaParts.join(' · ')}</p>` : ''}
            <h1 class="essay-title">${isThought ? formatDate(entry.date) : entry.title}</h1>
            ${entry.rating ? `<p class="rating-line">${starString(entry.rating)}</p>` : ''}
            ${entry.image ? `<img class="hero-image" src="${entry.image}" alt="${entry.imageAlt || entry.title || 'Photo'}" />` : ''}
            ${(entry.tags && entry.tags.length) ? `<p class="essay-tags">${entry.tags.map(t => `<a href="#/tag/${encodeURIComponent(t)}">${t}</a>`).join(' · ')}</p>` : '<div style="margin-bottom:2.4rem;"></div>'}
            <div class="essay-body">${entry.content.map(p => `<p>${p}</p>`).join('')}</div>
            <hr class="essay-end" />
            <div class="essay-actions"><button class="copy-link-btn" type="button">Copy link</button></div>
            <nav class="essay-pagination">${prevHTML}${nextHTML}</nav>
          </article>
        </main>
        ${renderFooter()}
      `;
    }

    function renderAbout() {
      return `
        ${renderHeader('about')}
        <main id="main">
          <section class="wrap about-wrap">
            <div class="monogram">${SITE.authorInitials}</div>
            <h1 class="page-title">About</h1>
            <div class="about-body">
              <p>Hi, I'm ${SITE.author}.</p>
              ${SITE.bio.map(p => `<p>${p}</p>`).join('')}
            </div>
            <div class="about-links">
              <a href="${SITE.instagramUrl}" target="_blank" rel="noopener">Instagram ↗</a>
              <a href="mailto:${SITE.email}">Email ↗</a>
            </div>
          </section>
        </main>
        ${renderFooter()}
      `;
    }

    function render404() {
      return `
        ${renderHeader('')}
        <main id="main">
          <section class="wrap page-head">
            <p class="section-label">Not found</p>
            <h1 class="page-title">That page doesn't exist (yet).</h1>
            <p style="margin-top:1.2rem;"><a href="#/" class="see-all">← Back home</a></p>
          </section>
        </main>
        ${renderFooter()}
      `;
    }

    function router() {
      let hash = window.location.hash || '#/';
      if (hash === '#') hash = '#/';

      if (hash === '#subscribe') {
        const el = document.getElementById('subscribe');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const path = hash.slice(1);
      const segments = path.split('/').filter(Boolean);

      const app = document.getElementById('app');
      let html;
      if (segments.length === 0) {
        html = renderHome();
      } else if (segments[0] === 'about') {
        html = renderAbout();
      } else if (segments[0] === 'tag' && segments[1]) {
        html = renderTagView(decodeURIComponent(segments[1]));
      } else if (SECTION_KEYS.indexOf(segments[0]) !== -1) {
        html = segments[1] ? renderDetail(segments[0], decodeURIComponent(segments[1])) : renderArchive(segments[0]);
      } else {
        html = render404();
      }

      app.innerHTML = html;
      window.scrollTo(0, 0);
    }

    document.addEventListener('submit', function (e) {
      if (e.target && e.target.id === 'newsletter-form') {
        e.preventDefault();
        const form = e.target;
        const input = form.querySelector('input[type=email]');
        const msg = form.querySelector('.form-msg');
        if (input && input.value && input.value.includes('@')) {
          msg.textContent = "Thanks — you're on the list.";
          form.reset();
        }
      }
    });

    document.addEventListener('click', function (e) {
      const btn = e.target.closest('.copy-link-btn');
      if (btn) {
        navigator.clipboard.writeText(window.location.href).then(() => {
          const original = btn.textContent;
          btn.textContent = 'Copied';
          setTimeout(() => { btn.textContent = original; }, 1500);
        }).catch(() => {});
      }
    });

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);
  </script>
</body>
</html>
